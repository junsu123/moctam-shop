# Sao chép thành config.toml (KHÔNG đưa vào git). Có thể thay khóa bằng biến môi trường:
#   XUONG_SITE_URL, XUONG_READ_KEY, XUONG_WRITE_KEY, XUONG_LLM_KEY

db_path = "data/xuong_ai.sqlite3"
proposals_dir = "proposals"

[site]
base_url  = "https://ten-mien-cua-ban.vn"
read_key  = ""   # khóa có quyền events:read, catalog:read  (Quản trị → Khóa API Python)
write_key = ""   # khóa có quyền drafts:write
timeout   = 20

[llm]
provider = "anthropic"          # anthropic | openai | none (tắt LLM, các tác nhân không cần LLM vẫn chạy)
model    = "claude-haiku-5-5"   # model rẻ là đủ cho bản nháp; kiểm tra tên model hiện hành của nhà cung cấp
api_key  = ""
max_calls_per_day    = 50
max_cost_per_day_usd = 1.0
price_in_per_mtok    = 1.0      # USD / 1 triệu token — cập nhật theo bảng giá thực tế để ước tính chi phí đúng
price_out_per_mtok   = 5.0

[agents]
faq_threshold          = 0.10   # chạy `python -m xuong_ai calibrate` để có giá trị đề xuất
care_only_consented    = true   # chỉ đề xuất khách đã đồng ý nhận tiếp thị
care_horizon_days      = 7
care_overdue_days      = 21
crosssell_min_support  = 2
crosssell_max_per_product = 3
blog_drafts_per_run    = 2
faq_drafts_per_run     = 5

[brain]      # bộ não "Trưởng văn phòng" — xem docs/VAN-PHONG-AI.md
paused             = false   # công tắc tạm dừng (hoặc tạo tệp STOP cạnh tệp này)
tick_seconds       = 60      # nhịp làm việc
max_tasks_per_tick = 6
max_pending_review = 15      # không để quá N bản nháp AI chờ nhân viên duyệt
care_backlog_cap   = 60      # danh sách chăm sóc còn quá N khách chưa xử lý → ngừng gửi thêm
human_only_question_types = ["di_ung"]   # loại câu hỏi AI không được soạn câu trả lời → chuyển người
max_ai_attempts    = 2       # bản nháp bị từ chối N lần → chuyển người viết
brief_hour         = 7       # giờ (Việt Nam) viết bản tin văn phòng; tệp ở office/
office_dir         = "office"

[brain.goals]   # trọng số mục tiêu: càng cao càng được ưu tiên
van_hanh      = 1.0   # website vận hành ổn định, đồng bộ kịp thời
tra_loi_khach = 0.8   # khách hỏi gì cũng có câu trả lời đúng
giu_chan      = 0.6   # nhắc khách cũ mua lại đúng lúc
gia_tri_don   = 0.4   # gợi ý mua kèm
noi_dung_seo  = 0.4   # bài viết cho sản phẩm

[brain.daily_caps]   # tối đa mỗi ngày
faq_draft   = 5
blog_draft  = 2
care_list   = 1
crosssell   = 1
maintenance = 1

[schedule]   # phút giữa hai lần chạy (việc định kỳ; việc soạn nháp do bộ não quyết)
sync        = 10
catalog     = 60
feedback    = 60
crosssell   = 1440
care        = 1440
faq_drafts  = 1440
blog_drafts = 10080
maintenance = 10080
