# Kiểm thử tự động cho AI Marketing Company (SRS §18, TEST_PLAN). Chạy khi có thay đổi trong ai-company/.
name: ai-company
on:
  pull_request:
    paths: ["ai-company/**", "web/**", ".github/workflows/ai-company.yml"]
  push:
    branches: [main]
    paths: ["ai-company/**", "web/**", ".github/workflows/ai-company.yml"]
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: ai-company/backend } }
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env: { POSTGRES_USER: aico, POSTGRES_PASSWORD: aico, POSTGRES_DB: aico_test }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U aico" --health-interval 5s --health-timeout 5s --health-retries 20
      valkey:
        image: valkey/valkey:8-alpine
        ports: ["6379:6379"]
      mariadb:  # website THẬT cho IT-PUB-01/02 (AI xuất bản qua API của website)
        image: mariadb:10.11  # cùng bản với máy dev; MariaDB ≥ 11.6 bật innodb_snapshot_isolation, xem sprint-4.md
        env: { MARIADB_ROOT_PASSWORD: root }
        ports: ["3306:3306"]
        options: --health-cmd "healthcheck.sh --connect --innodb_initialized" --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      AICO_TEST_DATABASE_URL: postgresql+psycopg://aico:aico@127.0.0.1:5432/aico_test
      AICO_TEST_REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: shivammathur/setup-php@v2
        with: { php-version: "8.3", extensions: "pdo_mysql, mbstring, intl, gd, zip, curl", coverage: none }
      - run: pip install "uv==0.11.*"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app
      - name: Dựng website thật (PHP + MariaDB) cho kiểm thử xuất bản
        run: DB_USER=root DB_PASS=root ../../web/tests/it_server.sh | sed 's/^export //' | tr ' ' '\n' >> "$GITHUB_ENV"
      - run: uv run pytest -p no:warnings -rs

  website:
    # Ca nghiệm thu của website (web/tests/acceptance.php), gồm AT-09' (AI xuất bản qua khóa content:publish)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    services:
      mariadb:
        image: mariadb:10.11  # cùng bản với máy dev; MariaDB ≥ 11.6 bật innodb_snapshot_isolation, xem sprint-4.md
        env: { MARIADB_ROOT_PASSWORD: root }
        ports: ["3306:3306"]
        options: --health-cmd "healthcheck.sh --connect --innodb_initialized" --health-interval 5s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: "8.3", extensions: "pdo_mysql, mbstring, intl, gd, zip, curl", coverage: none }
      # AT-11 sao lưu/khôi phục bằng mysqldump + mysql: dùng client MariaDB cùng bản (client MySQL 8 của runner không hợp)
      - run: sudo apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq mariadb-client
      - name: Cấu hình kiểm thử
        run: |
          cat > app/config.php <<'PHP'
          <?php
          $c = require __DIR__ . '/config.sample.php';
          $c['debug'] = true;
          $c['base_url'] = 'http://127.0.0.1:8080';
          $c['db'] = ['host' => '127.0.0.1', 'port' => 3306, 'name' => 'xuong_test', 'user' => 'root', 'password' => 'root'];
          $c['app_key'] = str_repeat('c', 64);
          $c['session']['secure'] = false;
          return $c;
          PHP
      - run: php tests/acceptance.php

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: ai-company/frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: ai-company/frontend/package-lock.json }
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
        env: { NEXT_TELEMETRY_DISABLED: "1" }

  e2e:
    # Đi hết luồng Owner trên trình duyệt thật: thiết lập 2FA → agent → diễn biến trực tiếp → Telegram (bot giả) → cài đặt
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env: { POSTGRES_USER: aico, POSTGRES_PASSWORD: aico, POSTGRES_DB: aico_e2e }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U aico" --health-interval 5s --health-timeout 5s --health-retries 20
      valkey:
        image: valkey/valkey:8-alpine
        ports: ["6379:6379"]
    env:
      AICO_E2E_DATABASE_URL: postgresql+psycopg://aico:aico@127.0.0.1:5432/aico_e2e
      AICO_E2E_REDIS_URL: redis://127.0.0.1:6379/0
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: ai-company/frontend/package-lock.json }
      - run: pip install "uv==0.11.*" "pytest==9.*" "playwright==1.*" "pyotp==2.*"
      - run: python -m playwright install --with-deps chromium
      - run: uv sync --frozen
        working-directory: ai-company/backend
      - run: npm ci --no-audit --no-fund
        working-directory: ai-company/frontend
      - run: ./ai-company/e2e/run.sh
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots-logs
          path: |
            ai-company/e2e/screenshots/
            ai-company/e2e/logs/
          if-no-files-found: ignore

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Kiểm tra cú pháp docker-compose.yml
        working-directory: ai-company
        run: AICO_DB_PASSWORD=ci AICO_MASTER_KEY=ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci docker compose config -q
      - name: Build image backend + frontend
        working-directory: ai-company
        run: AICO_DB_PASSWORD=ci AICO_MASTER_KEY=ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci docker compose build backend frontend

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
