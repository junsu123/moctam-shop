# Quyền (công cụ × hành động × cấp tự chủ 1–4). Chỉ Owner sửa; nằm trong hash quy tắc cốt lõi.
permissions:
- tool: signals
  action: read
  level: 1
- tool: analytics
  action: overview
  level: 1
- tool: task
  action: create
  level: 2
- tool: task
  action: delegate
  level: 2
- tool: task
  action: review
  level: 2
- tool: report
  action: compose
  level: 2
- tool: notify
  action: owner
  level: 3
  limits:
    per_day: 6
