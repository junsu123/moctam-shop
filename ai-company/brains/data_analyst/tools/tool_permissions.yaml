# Quyền (công cụ × hành động × cấp tự chủ 1–4). Chỉ Owner sửa; nằm trong hash quy tắc cốt lõi.
permissions:
- tool: sql
  action: readonly
  level: 1
- tool: python
  action: sandbox
  level: 1
- tool: site
  action: aggregates
  level: 1
- tool: finance
  action: read
  level: 1
- tool: signals
  action: read
  level: 1
- tool: report
  action: compose
  level: 2
- tool: notify
  action: owner
  level: 3
  limits:
    per_day: 6
