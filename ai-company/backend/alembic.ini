[alembic]
script_location = migrations
# Chuỗi kết nối lấy từ AICO_DATABASE_URL (migrations/env.py), không ghi ở đây.

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = plain

[logger_root]
level = INFO
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stdout,)
formatter = plain

[formatter_plain]
format = %(levelname)s %(name)s: %(message)s
