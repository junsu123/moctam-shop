[project]
name = "aico-backend"
version = "0.1.0"
description = "AI Marketing Company Platform: máy chủ (FastAPI)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0.30",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "redis>=5.0",
    "argon2-cffi>=25.1.0",
    "pyotp>=2.12.1",
    "segno>=1.6.6",
    "cryptography>=50.0.2",
    "httpx>=0.28.1",
    "email-validator>=2.4.0",
    "pyyaml>=6.0.4",
    "opentelemetry-api>=1.45.2",
    "opentelemetry-sdk>=1.45.2",
    "opentelemetry-exporter-otlp-proto-http>=1.45.2",
    "opentelemetry-instrumentation-fastapi>=0.66b2",
    "opentelemetry-instrumentation-httpx>=0.66b2",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-pyyaml>=6.0.12.20261122",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC"]
ignore = ["S101"]  # assert trong test

[tool.ruff.lint.pycodestyle]
max-line-length = 160  # formatter vẫn gói ở 140; chỉ cho phép câu SQL dài một dòng

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Body"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S603", "S404", "S608", "S311"]  # test: subprocess alembic tham số cố định; SQL dựng từ dữ liệu test; random có hạt giống
"bench/**" = ["S608", "S311"]  # công cụ đo: SQL dựng từ hằng số; random có hạt giống để lặp lại được

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["migrations/"]
